<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>Exemplo-6 - JQuery</title>

    <!-- 2. Inclusão do jQuery e Script app.js -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"> <!-- para chamar o Jquery e bootstrap precisa estar dentro do head -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <!-- 1. Estrutura HTML Base Unificada (Bootstrap 5) -->
    <form id="form-cadastro">
          <input type="text" id="input-nome" class="form-control mb-2" placeholder="Nome">
          <input type="email" id="input-email" class="form-control mb-2" placeholder="E-mail"> <!-- padrão do html5, --> 
          <button type="submit" id="btn-salvar" class="btn btn-primary">Salvar</button> <!-- aqui o submit vai mandar a informação para algum lugar e Salvar é o texto que fica dentro do --> 
</form>

<!--a classe d-none já oculta a classe na entrada-->
<div id="caixa-mensagem" class="alert alert-info mt-3 d-none"></div>

<!-- 2. Inclusão do jQuery e Script app.js -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
$(document).ready(function() {

    $('#form-cadastro').on('submit', function(e) {
        e.preventDefault();

        const nome = $('#input-nome').val();
        const email = $('#input-email').val();

 // NOVO NO EXEMPLO 7: Troca de classes e animação de piscar 2x
    $('#caixa-mensagem')
      .removeClass('d-none alert-info alert-danger')
      .addClass('alert-success')
      .html(`🎉 <strong>Sucesso!</strong> Cliente <u>${nome}</u> cadastrado!`)
      .fadeOut(150).fadeIn(150)
      .fadeOut(150).fadeIn(400);
  });
});


</script>


</body>
</html>
